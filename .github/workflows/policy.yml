# Only this repo's policies gate PRs. Fixtures are tested separately from real files.
# --error blocks on every Semgrep finding, including WARNING severity.
# Conftest denies block; supply-chain warnings remain advisory.
name: Policy as code

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    env:
      CONFTEST_VERSION: "0.69.0"
      # From the release's checksums.txt for conftest_0.69.0_Linux_x86_64.tar.gz.
      CONFTEST_SHA256: "96fc2fbf11f0afde51256647127e6f00a64ce839a4d9a0a1aef2426c0e6f4b3f"
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.183.0

      - name: Install conftest (pinned and checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -sSfL -o conftest.tar.gz "$url"
          echo "${CONFTEST_SHA256}  conftest.tar.gz" | sha256sum --check --status \
            || { echo "::error::conftest tarball checksum mismatch — refusing to run an unverified binary."; exit 1; }
          tar -xzf conftest.tar.gz conftest
          install -m 0755 conftest /usr/local/bin/conftest
          conftest --version

      - name: Semgrep rule unit tests
        run: npm run semgrep:test

      - name: Semgrep scan with the repo's own rules
        run: npm run semgrep:policy

      - name: Conftest policy unit tests
        run: npm run conftest:test

      - name: Conftest policies against workflows
        run: npm run conftest
